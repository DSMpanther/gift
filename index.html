<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Merry Christmas 🎁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    #unmute-pill {
      position: fixed;
      bottom: 40px;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 12px 24px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
  </style>
</head>
<body onclick="unmute()">
  <video id="giftVideo" autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div id="unmute-pill">Tap anywhere for sound 🔊</div>

  <script>
    const video = document.getElementById('giftVideo');
    const pill = document.getElementById('unmute-pill');
    function unmute() {
      if (video.muted) {
        video.muted = false;
        video.currentTime = 0;
        pill.style.display = 'none';
      }
    }
  </script>
</body>
</html>
